[package]
name = "bulbul-birding"
version = "0.38.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Bulbul birding CLI and stdio MCP server"

[[bin]]
name = "bulbul"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
directories = "6"
percent-encoding = "2"
jsonschema = { version = "0.58", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process", "signal", "time", "sync"] }
url = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
